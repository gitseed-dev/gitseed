name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0; defaults to git tag or Chart.yaml version)"
        required: false
        type: string
      dry_run:
        description: "Build multi-arch images, Helm chart, and Python wheels without pushing"
        required: false
        type: boolean
        default: false
      publish_containers:
        description: "Push container images and OCI Helm chart to ghcr.io/gitseed-dev (or set repo var PUBLISH_CONTAINERS=true)"
        required: false
        type: boolean
        default: false
      publish_pypi:
        description: "Publish Python packages to PyPI (or set repo var PUBLISH_PYPI=true for automatic tag publishing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  images:
    name: Multi-Arch Container Images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version & push mode
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PUBLISH_CONTAINERS: ${{ inputs.publish_containers }}
          VAR_PUBLISH_CONTAINERS: ${{ vars.PUBLISH_CONTAINERS }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            RAW_VER="${INPUT_VERSION#v}"
          else
            RAW_VER="$(awk -F': ' '/^version:/ {gsub(/"/, "", $2); print $2; exit}' charts/gitseed/Chart.yaml)"
          fi
          echo "version=${RAW_VER}" >> "${GITHUB_OUTPUT}"
          if [[ "${INPUT_DRY_RUN}" != "true" && ( "${INPUT_PUBLISH_CONTAINERS}" == "true" || "${VAR_PUBLISH_CONTAINERS}" == "true" ) ]]; then
            echo "push=true" >> "${GITHUB_OUTPUT}"
          else
            echo "push=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ steps.meta.outputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Control Plane image (ghcr.io/gitseed-dev/gitseed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          build-args: |
            GITSEED_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/gitseed-dev/gitseed:${{ steps.meta.outputs.version }}
            ghcr.io/gitseed-dev/gitseed:latest
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

      - name: Build Runner Sandbox image (ghcr.io/gitseed-dev/runner)
        uses: docker/build-push-action@v7
        with:
          context: ./apps/runner
          file: ./apps/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          build-args: |
            GITSEED_VERSION=${{ steps.meta.outputs.version }}
            INCLUDE_PROPRIETARY_CLIS=false
          tags: |
            ghcr.io/gitseed-dev/runner:${{ steps.meta.outputs.version }}
            ghcr.io/gitseed-dev/runner:latest
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  helm:
    name: OCI Helm Chart (ghcr.io/gitseed-dev/charts)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Resolve chart version & push mode
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PUBLISH_CONTAINERS: ${{ inputs.publish_containers }}
          VAR_PUBLISH_CONTAINERS: ${{ vars.PUBLISH_CONTAINERS }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            RAW_VER="${INPUT_VERSION#v}"
          else
            RAW_VER="$(awk -F': ' '/^version:/ {gsub(/"/, "", $2); print $2; exit}' charts/gitseed/Chart.yaml)"
          fi
          echo "version=${RAW_VER}" >> "${GITHUB_OUTPUT}"
          if [[ "${INPUT_DRY_RUN}" != "true" && ( "${INPUT_PUBLISH_CONTAINERS}" == "true" || "${VAR_PUBLISH_CONTAINERS}" == "true" ) ]]; then
            echo "push=true" >> "${GITHUB_OUTPUT}"
          else
            echo "push=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Lint & package Helm chart
        env:
          CHART_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          helm lint charts/gitseed
          helm template gitseed charts/gitseed >/dev/null
          mkdir -p dist-charts
          helm package charts/gitseed \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}" \
            --destination dist-charts

      - name: Push Helm chart to GHCR OCI registry
        if: ${{ steps.meta.outputs.push == 'true' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          CHART_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${GHCR_ACTOR}" --password-stdin
          helm push "dist-charts/gitseed-${CHART_VERSION}.tgz" oci://ghcr.io/gitseed-dev/charts

  python-build:
    name: Build Python Packages (common, cli, mcp)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Resolve package version & align package metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            RAW_VER="${INPUT_VERSION#v}"
          else
            RAW_VER="$(awk -F': ' '/^version:/ {gsub(/"/, "", $2); print $2; exit}' charts/gitseed/Chart.yaml)"
          fi
          python3 - "${RAW_VER}" <<'PY'
          import pathlib, re, shutil, sys
          ver = sys.argv[1]
          for rel in ("packages/common/pyproject.toml", "apps/cli/pyproject.toml", "apps/mcp/pyproject.toml"):
              p = pathlib.Path(rel)
              pkg_dir = p.parent
              shutil.copyfile("LICENSE", pkg_dir / "LICENSE")
              shutil.copyfile("NOTICE", pkg_dir / "NOTICE")
              txt = p.read_text(encoding="utf-8")
              updated, count = re.subn(r'(?m)^version\s*=\s*"[^"]+"', f'version = "{ver}"', txt, count=1)
              assert count == 1, f"Failed to update version in {rel}"
              if rel in ("apps/cli/pyproject.toml", "apps/mcp/pyproject.toml"):
                  updated, dep_count = re.subn(
                      r'"gitseed-common(?:==[^"]+)?"',
                      f'"gitseed-common=={ver}"',
                      updated,
                      count=1,
                  )
                  assert dep_count == 1, f"Failed to pin gitseed-common=={ver} in {rel}"
              p.write_text(updated, encoding="utf-8")
          init_path = pathlib.Path("packages/common/src/gitseed_common/__init__.py")
          init_txt = init_path.read_text(encoding="utf-8")
          init_updated, init_count = re.subn(
              r'(?m)^__version__\s*=\s*"[^"]+"',
              f'__version__ = "{ver}"',
              init_txt,
              count=1,
          )
          assert init_count == 1, "Failed to update __version__ in gitseed_common/__init__.py"
          init_path.write_text(init_updated, encoding="utf-8")
          PY

      - name: Build distributions with uv
        run: |
          mkdir -p dist
          uv build packages/common --out-dir dist
          uv build apps/cli --out-dir dist
          uv build apps/mcp --out-dir dist
          rm -f dist/.gitignore
          ls -la dist
          python3 - <<'PY'
          import pathlib, tarfile, zipfile
          dist_files = sorted(
              p for p in pathlib.Path("dist").iterdir() if p.name.endswith((".whl", ".tar.gz"))
          )
          assert len(dist_files) == 6, f"Expected 6 artifacts (3 wheels + 3 sdists), got {len(dist_files)}: {[p.name for p in dist_files]}"
          for artifact in dist_files:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as zf:
                      names = zf.namelist()
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact, "r:gz") as tf:
                      names = tf.getnames()
              else:
                  continue
              assert any(n.endswith("/LICENSE") or n == "LICENSE" for n in names), f"Missing LICENSE in {artifact}"
              assert any(n.endswith("/NOTICE") or n == "NOTICE" for n in names), f"Missing NOTICE in {artifact}"
          print("Verified LICENSE and NOTICE in all 6 built distributions.")
          PY

      - name: Upload built Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI (OIDC Trusted Publishing)
    needs: [python-build]
    if: ${{ inputs.dry_run != true && (inputs.publish_pypi == true || vars.PUBLISH_PYPI == 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gitseed-cli
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download built Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
