name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: write # stores signatures on the `cla-signatures` branch
  pull-requests: write
  statuses: write

concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && (contains(github.event.comment.body, 'recheck') || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
      || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          branch: "cla-signatures"
          create-file-commit: "chore(cla): initialize CLA signatures store"
          signed-commit: "chore(cla): @$contributorName has signed the CLA in #$pullRequestNo"
          lock-pullrequest-aftermerge: false
          use-dco-flag: false
          allowlist: "TrentSeed,dependabot[bot],renovate[bot],github-actions[bot]"
          custom-notsigned-prcomment: |
            Thanks for your contribution! Before we can merge it, please read the [GitSeed Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md). You keep the copyright to your work; the CLA lets the project ship it under Apache-2.0 and future editions.

            To sign, reply to this PR with the exact comment below. You only need to do this once.
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you! 🌱"

