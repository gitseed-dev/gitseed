name: Bug Report
description: Report a bug in the GitSeed control plane, runner, CLI, MCP server, or Web UI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and which component is affected (`apps/core`, `apps/runner`, `apps/cli`, `apps/mcp`, `apps/web`, or Helm/Docker).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start GitSeed via `docker compose up`
        2. Run `gitseed ...`
        3. Observe error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Docker/Kubernetes version, agent runtime (claude-code, codex, opencode, etc.)"

