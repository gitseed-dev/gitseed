{{- if and .Values.gitops.requireExistingSecret (not .Values.auth.existingSecret) -}}
{{- fail "gitops.requireExistingSecret is true: set auth.existingSecret to a pre-created Kubernetes Secret so GitOps syncs (ArgoCD/Flux) do not rotate GITSEED_SECRET_KEY." -}}
{{- end -}}
{{- if not .Values.auth.existingSecret -}}
{{- $existingSec := (lookup "v1" "Secret" .Release.Namespace (include "gitseed.secretName" .)) -}}
{{- $secretKey := .Values.auth.secretKey -}}
{{- if or (not $secretKey) (eq $secretKey "gitseed-k8s-secret-key-change-in-production-32chars") -}}
  {{- if and $existingSec (hasKey $existingSec.data "GITSEED_SECRET_KEY") -}}
    {{- $secretKey = (index $existingSec.data "GITSEED_SECRET_KEY" | b64dec) -}}
  {{- else -}}
    {{- $secretKey = (randAlphaNum 48) -}}
  {{- end -}}
{{- end -}}
{{- $litellmMasterKey := .Values.litellm.masterKey -}}
{{- if or (not $litellmMasterKey) (eq $litellmMasterKey "sk-gitseed-litellm-master-key") -}}
  {{- if and $existingSec (hasKey $existingSec.data "LITELLM_MASTER_KEY") -}}
    {{- $litellmMasterKey = (index $existingSec.data "LITELLM_MASTER_KEY" | b64dec) -}}
  {{- else -}}
    {{- $litellmMasterKey = (printf "sk-gitseed-%s" (randAlphaNum 32)) -}}
  {{- end -}}
{{- end -}}
{{- $litellmSaltKey := .Values.litellm.saltKey -}}
{{- if or (not $litellmSaltKey) (eq $litellmSaltKey "sk-gitseed-litellm-salt-key") -}}
  {{- if and $existingSec (hasKey $existingSec.data "LITELLM_SALT_KEY") -}}
    {{- $litellmSaltKey = (index $existingSec.data "LITELLM_SALT_KEY" | b64dec) -}}
  {{- else -}}
    {{- $litellmSaltKey = (printf "sk-gitseed-salt-%s" (randAlphaNum 32)) -}}
  {{- end -}}
{{- end -}}
{{- $pgPass := ternary .Values.postgresql.auth.password .Values.externalDatabase.password .Values.postgresql.enabled -}}
{{- if or (not $pgPass) (eq $pgPass "gitseed_password") (eq $pgPass "postgres") (eq $pgPass "password") (eq $pgPass "changeme") -}}
  {{- if and $existingSec (hasKey $existingSec.data "POSTGRES_PASSWORD") -}}
    {{- $pgPass = (index $existingSec.data "POSTGRES_PASSWORD" | b64dec) -}}
  {{- else -}}
    {{- $pgPass = (randAlphaNum 32) -}}
  {{- end -}}
{{- end -}}
{{- $valkeyAuth := .Values.valkey.auth | default dict -}}
{{- $valkeyPass := index $valkeyAuth "password" -}}
{{- if not $valkeyPass -}}
  {{- if and $existingSec (hasKey $existingSec.data "VALKEY_PASSWORD") -}}
    {{- $valkeyPass = (index $existingSec.data "VALKEY_PASSWORD" | b64dec) -}}
  {{- else -}}
    {{- $valkeyPass = (randAlphaNum 32) -}}
  {{- end -}}
{{- end -}}
{{- $_ := set $valkeyAuth "_resolvedPassword" $valkeyPass -}}
{{- $_ := set .Values.valkey "auth" $valkeyAuth -}}
{{- $pgUser := ternary .Values.postgresql.auth.username .Values.externalDatabase.username .Values.postgresql.enabled -}}
{{- $pgPort := ternary .Values.postgresql.port .Values.externalDatabase.port .Values.postgresql.enabled -}}
{{- $pgDb := ternary .Values.postgresql.auth.database .Values.externalDatabase.database .Values.postgresql.enabled -}}
{{- $pgHost := include "gitseed.postgresHost" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitseed.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitseed.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  GITSEED_SECRET_KEY: {{ $secretKey | quote }}
  GITSEED_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" $pgUser (urlquery $pgPass) $pgHost $pgPort $pgDb | quote }}
  LITELLM_MASTER_KEY: {{ $litellmMasterKey | quote }}
  LITELLM_SALT_KEY: {{ $litellmSaltKey | quote }}
  LITELLM_DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" $pgUser (urlquery $pgPass) $pgHost $pgPort .Values.litellm.databaseName | quote }}
  VALKEY_PASSWORD: {{ $valkeyPass | quote }}
  REDIS_URL: {{ include "gitseed.redisUrl" . | quote }}
{{- end }}
