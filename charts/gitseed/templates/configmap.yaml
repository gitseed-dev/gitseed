{{- $fullname := include "gitseed.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitseed.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  ENVIRONMENT: {{ .Values.environment | quote }}
  DEBUG: {{ .Values.debug | quote }}
  GITSEED_AUTO_MIGRATE: {{ .Values.autoMigrate | quote }}
  API_PORT: {{ .Values.api.port | quote }}
  WEB_PORT: {{ .Values.web.port | quote }}
  MCP_PORT: {{ .Values.mcp.port | quote }}
  SANDBOX_PORT: {{ .Values.web.sandboxPort | quote }}
  ARTIFACTS_DIR: "/app/data/artifacts"
  GITSEED_ADMIN_EMAIL: {{ .Values.auth.adminEmail | quote }}
  GITSEED_ADMIN_NAME: {{ .Values.auth.adminName | quote }}
  PUBLIC_WEB_URL: {{ .Values.web.publicUrl | quote }}
  SANDBOX_ORIGIN: {{ .Values.web.sandboxOrigin | quote }}
  CORS_ORIGINS: {{ .Values.web.corsOrigins | quote }}
  GITSEED_MCP_ALLOWED_ORIGINS: {{ printf "%s,%s" .Values.web.publicUrl .Values.web.corsOrigins | quote }}
  SCHEDULER_POLL_SECONDS: {{ .Values.scheduler.pollSeconds | quote }}

  # Database & Cache (REDIS_URL is injected via Secret so Valkey/Redis credentials never enter ConfigMap)
  POSTGRES_HOST: {{ include "gitseed.postgresHost" . | quote }}
  POSTGRES_PORT: {{ (ternary .Values.postgresql.port .Values.externalDatabase.port .Values.postgresql.enabled) | quote }}
  POSTGRES_USER: {{ (ternary .Values.postgresql.auth.username .Values.externalDatabase.username .Values.postgresql.enabled) | quote }}
  POSTGRES_DB: {{ (ternary .Values.postgresql.auth.database .Values.externalDatabase.database .Values.postgresql.enabled) | quote }}

  # LiteLLM Gateway & Cross-Namespace Runner Endpoints (FQDN so isolated namespaces can reach control-plane services)
  API_UPSTREAM: {{ printf "%s-api:%v" $fullname .Values.api.port | quote }}
  GITSEED_API_URL: {{ printf "http://%s-api.%s.svc.cluster.local:%v" $fullname .Release.Namespace .Values.api.port | quote }}
  LITELLM_URL: {{ printf "http://%s-litellm.%s.svc.cluster.local:%v" $fullname .Release.Namespace .Values.litellm.port | quote }}
  RUNNER_API_URL: {{ printf "http://%s-api.%s.svc.cluster.local:%v" $fullname .Release.Namespace .Values.api.port | quote }}
  RUNNER_GATEWAY_URL: {{ printf "http://%s-litellm.%s.svc.cluster.local:%v/v1" $fullname .Release.Namespace .Values.litellm.port | quote }}
  {{- if .Values.egressProxy.enabled }}
  EGRESS_PROXY_PORT: {{ .Values.egressProxy.port | quote }}
  RUNNER_EGRESS_PROXY_URL: {{ printf "http://%s-egress-proxy.%s.svc.cluster.local:%v" $fullname .Release.Namespace .Values.egressProxy.port | quote }}
  EGRESS_INTERNAL_HOSTS: {{ printf "%s-litellm:%v,%s-api:%v,%s-litellm.%s.svc.cluster.local:%v,%s-api.%s.svc.cluster.local:%v,litellm:%v,api:%v" $fullname .Values.litellm.port $fullname .Values.api.port $fullname .Release.Namespace .Values.litellm.port $fullname .Release.Namespace .Values.api.port .Values.litellm.port .Values.api.port | quote }}
  {{- end }}
  RUNNER_IMAGE: {{ include "gitseed.runnerImage" . | quote }}

  # Kubernetes Compute Pre-Seeding & Namespace Isolation
  GITSEED_BOOTSTRAP_COMPUTE_PROVIDER: {{ .Values.compute.bootstrapProvider | quote }}
  K8S_API_URL: {{ .Values.compute.kubernetesApiUrl | quote }}
  RUNNER_K8S_NAMESPACE: {{ include "gitseed.runnerNamespace" . | quote }}
  SANDBOX_K8S_NAMESPACE: {{ include "gitseed.sandboxNamespace" . | quote }}
  K8S_NAMESPACE_ISOLATION: {{ .Values.compute.namespaceIsolation | quote }}
  RUNNER_K8S_SERVICE_ACCOUNT: {{ .Values.compute.runnerServiceAccount | quote }}
