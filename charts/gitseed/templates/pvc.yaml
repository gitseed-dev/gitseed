{{- if .Values.api.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gitseed.fullname" . }}-artifacts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitseed.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ (default .Values.persistence.artifacts.accessMode .Values.api.persistence.accessMode) | quote }}
  {{- if .Values.api.persistence.storageClass }}
  storageClassName: {{ .Values.api.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size | quote }}
{{- end }}
