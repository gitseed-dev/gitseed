{{- $fullname := include "gitseed.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitseed.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.api.sessionAffinity }}
  sessionAffinity: {{ .Values.api.sessionAffinity }}
  {{- end }}
  ports:
    - port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gitseed.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitseed.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.web.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.web.sandboxPort }}
      targetPort: sandbox
      protocol: TCP
      name: sandbox
  selector:
    {{- include "gitseed.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
