[project]
name = "gitseed-cli"
version = "0.1.0"
description = "GitSeed developer CLI and interactive split-pane Terminal UI (TUI)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Trent Seed" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=42.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.12",
  "gitseed-common",
]

[project.urls]
Homepage = "https://github.com/gitseed-dev/gitseed"
Repository = "https://github.com/gitseed-dev/gitseed"
Issues = "https://github.com/gitseed-dev/gitseed/issues"

[project.scripts]
gitseed = "gitseed_cli.main:cli"

[tool.uv.sources]
gitseed-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitseed_cli"]
