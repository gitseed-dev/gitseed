[project]
name = "gitseed-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for the GitSeed control plane"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Trent Seed" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2.7",
  "pydantic-settings",
  "httpx>=0.27",
  "gitseed-common",
]

[project.urls]
Homepage = "https://github.com/gitseed-dev/gitseed"
Repository = "https://github.com/gitseed-dev/gitseed"
Issues = "https://github.com/gitseed-dev/gitseed/issues"

[project.scripts]
gitseed-mcp = "gitseed_mcp.main:cli"

[tool.uv.sources]
gitseed-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitseed_mcp"]
